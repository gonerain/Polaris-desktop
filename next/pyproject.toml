[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-platform"
dynamic = ["version"]
description = "Polaris independent desktop component platform"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "gonerain and contributors"}]
license = {text = "MIT (code); bundled artwork: CC BY-NC-SA 4.0 (non-commercial)"}

[project.urls]
Homepage = "https://github.com/gonerain/Polaris-desktop"
Source = "https://github.com/gonerain/Polaris-desktop"
Artwork = "https://github.com/PC2005-cloud/dsh-pet"

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.5"]

[project.scripts]
polaris-platform = "polaris_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polaris_platform*"]

[tool.setuptools.package-data]
"polaris_platform.desktop" = ["*.qml", "skins/dshpet/*.qml", "skins/dshpet/*.js", "skins/dshpet/*.webp", "skins/dshpet/*.json", "skins/dshpet/*.md", "skins/dshpet/*.txt"]

[tool.setuptools.dynamic]
version = {attr = "polaris_platform.metadata.VERSION"}
